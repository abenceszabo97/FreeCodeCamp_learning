<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Media Player Showcase</title>
  <style>
    body {
      background-color: #121212;
      color: #e0e0e0;
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 2em;
      line-height: 1.6;
    }

    h1, h2 {
      color: #ffffff;
      margin-bottom: 0.5em;
    }

    h1 {
      font-size: 2.5em;
      text-align: center;
      transition: transform 0.3s ease;
    }

    h1:hover {
      transform: scale(1.02);
    }

    section {
      margin: 3em auto;
      max-width: 720px;
      padding: 2em;
      background-color: #1e1e1e;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(255, 255, 255, 0.05);
      transition: transform 0.3s ease;
    }

    section:hover {
      transform: scale(1.01);
    }

    video, audio {
      display: block;
      margin: 1.5em auto;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(255, 255, 255, 0.05);
    }

    video {
      width: 640px;
      max-width: 100%;
    }
  </style>
</head>
<body>

  <h1>Media Player Showcase</h1>

  <section>
    <h2>Learn About JavaScript's Map Method</h2>
    <video controls width="640">
      <source src="https://cdn.freecodecamp.org/curriculum/labs/What%20is%20the%20map%20method%20and%20how%20does%20it%20work.mp4" type="video/mp4">
      Your browser does not support the video tag.
    </video>
  </section>

  <section>
    <h2>Relaxing Tune: Sailing Away</h2>
    <audio controls loop src="https://cdn.freecodecamp.org/curriculum/js-music-player/sailing-away.mp3">
      Your browser does not support the audio tag.
    </audio>
  </section>

</body>
</html>
