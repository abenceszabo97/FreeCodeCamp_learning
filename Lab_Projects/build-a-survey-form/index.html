<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Survey Form</title>
    <style>
      body {
        background-color: #121212;
        color: #e0e0e0;
        font-family: 'Segoe UI', sans-serif;
        padding: 2em;
        line-height: 1.6;
      }

      h1, p {
        text-align: center;
        margin-bottom: 1em;
      }

      form {
        max-width: 700px;
        margin: 0 auto;
        background-color: #1e1e1e;
        padding: 2em;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(255, 255, 255, 0.05);
      }

      label {
        display: block;
        margin: 1em 0 0.5em;
        font-weight: bold;
      }

      input, select, textarea {
        width: 100%;
        padding: 0.75em;
        margin-bottom: 1em;
        background-color: #2a2a2a;
        color: #fff;
        border: 1px solid #444;
        border-radius: 6px;
      }

      input[type="radio"], input[type="checkbox"] {
        width: auto;
        margin-right: 0.5em;
      }

      .radio-group, .checkbox-group {
        margin-bottom: 1.5em;
      }

      button {
        background-color: #a8d0e6;
        color: #000;
        border: none;
        padding: 1em 2em;
        font-size: 1em;
        border-radius: 8px;
        cursor: pointer;
        transition: background-color 0.3s ease;
      }

      button:hover {
        background-color: #f8c8dc;
      }
    </style>
  </head>
  <body>

    <h1 id="title">User Experience Survey</h1>
    <p id="description">We'd love to hear your thoughts about our platform. Please fill out the form below.</p>

    <form id="survey-form">

      <label id="name-label" for="name">Full Name</label>
      <input type="text" id="name" name="name" placeholder="Enter your full name" required />

      <label id="email-label" for="email">Email Address</label>
      <input type="email" id="email" name="email" placeholder="Enter your email" required />

      <label id="number-label" for="number">Age</label>
      <input type="number" id="number" name="age" placeholder="Enter your age" min="10" max="100" />

      <label for="dropdown">How did you hear about us?</label>
      <select id="dropdown" name="referral">
        <option value="">-- Select an option --</option>
        <option value="social">Social Media</option>
        <option value="friend">Friend Recommendation</option>
        <option value="ad">Advertisement</option>
      </select>

      <div class="radio-group">
        <label>How often do you use our service?</label>
        <label><input type="radio" name="frequency" value="daily" /> Daily</label>
        <label><input type="radio" name="frequency" value="weekly" /> Weekly</label>
        <label><input type="radio" name="frequency" value="monthly" /> Monthly</label>
      </div>

      <div class="checkbox-group">
        <label>What features do you use the most? (Select all that apply)</label>
        <label><input type="checkbox" name="features" value="dashboard" /> Dashboard</label>
        <label><input type="checkbox" name="features" value="notifications" /> Notifications</label>
        <label><input type="checkbox" name="features" value="analytics" /> Analytics</label>
      </div>

      <label for="comments">Additional Comments</label>
      <textarea id="comments" name="comments" rows="4" placeholder="Leave your thoughts here..."></textarea>

      <button type="submit" id="submit">Submit</button>
    </form>

  </body>
</html>
