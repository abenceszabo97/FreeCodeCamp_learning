<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Business Card</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="business-card">
    <img 
      class="profile-image" 
      src="https://cdn.freecodecamp.org/curriculum/labs/flower.jpg" 
      alt="A beautiful pink flower" 
    />
    <p class="full-name">Anna Kovács</p>
    <p class="designation">Creative Designer</p>
    <p class="company">Studio Aurora</p>
    <hr />
    <p>anna.kovacs@example.com</p>
    <p>+36 20 123 4567</p>
    <a class="portfolio-link" href="https://annakovacs-portfolio.com" target="_blank" rel="noopener noreferrer">Portfolio</a>
    <hr />
    <div class="social-media">
      <h2>Connect with me</h2>
      <a href="https://twitter.com/annakovacs" target="_blank" rel="noopener noreferrer">Twitter</a>
      <a href="https://linkedin.com/in/annakovacs" target="_blank" rel="noopener noreferrer">LinkedIn</a>
      <a href="https://github.com/annakovacs" target="_blank" rel="noopener noreferrer">GitHub</a>
    </div>
  </div>
</body>
</html>
