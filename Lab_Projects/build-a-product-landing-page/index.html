<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Product Landing Page</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header id="header">
    <img
      id="header-img"
      src="https://upload.wikimedia.org/wikipedia/commons/7/72/Black_logo.svg"
      alt="Company Logo"
    />
    <nav id="nav-bar">
      <a class="nav-link" href="#features">Features</a>
      <a class="nav-link" href="#video-section">Video</a>
      <a class="nav-link" href="#signup">Sign Up</a>
    </nav>
  </header>

  <section id="features">
    <h2>Our Product's Best Features</h2>
    <ul>
      <li>Sleek Design</li>
      <li>Easy to Use</li>
      <li>Fast and Reliable</li>
    </ul>
  </section>

  <section id="video-section">
    <h2>Discover the Product!</h2>
    <video id="video" controls src="https://www.w3schools.com/html/mov_bbb.mp4"></video>
  </section>

  <section id="signup">
    <h2>Subscribe to Our Newsletter</h2>
    <form
      id="form"
      action="https://www.freecodecamp.org/email-submit"
      method="POST"
    >
      <input
        id="email"
        name="email"
        type="email"
        placeholder="Enter your email address"
        required
      />
      <input id="submit" type="submit" value="Subscribe" />
    </form>
  </section>
</body>
</html>
