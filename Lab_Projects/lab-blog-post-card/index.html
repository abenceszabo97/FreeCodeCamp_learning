<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Blog Post Card</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div class="blog-post-card">
    <img 
      src="https://cdn.freecodecamp.org/curriculum/labs/cover-photo.jpg" 
      alt="Mountain landscape with sunset" 
      class="post-img"
    />
    <div class="post-content">
      <h2 class="post-title">Exploring the Beauty of Nature</h2>
      <p class="post-excerpt">
        Discover the amazing landscapes and diverse wildlife that make nature so inspiring and worth protecting.
      </p>
      <a href="#" class="read-more">Read More</a>
    </div>
  </div>

</body>
</html>
