<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Stylized To-Do List</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <ul class="todo-list">
    <li>
      <input type="checkbox" id="task1" />
      <label for="task1">Learn HTML Basics</label>
      <ul class="sub-item">
        <li><a class="sub-item-link" href="https://developer.mozilla.org/en-US/docs/Web/HTML" target="_blank">MDN HTML Guide</a></li>
      </ul>
    </li>
    <li>
      <input type="checkbox" id="task2" />
      <label for="task2">Practice CSS Styling</label>
      <ul class="sub-item">
        <li><a class="sub-item-link" href="https://css-tricks.com/" target="_blank">CSS-Tricks</a></li>
      </ul>
    </li>
    <li>
      <input type="checkbox" id="task3" />
      <label for="task3">JavaScript Fundamentals</label>
      <ul class="sub-item">
        <li><a class="sub-item-link" href="https://javascript.info/" target="_blank">JavaScript Info</a></li>
      </ul>
    </li>
    <li>
      <input type="checkbox" id="task4" />
      <label for="task4">Build Projects</label>
      <ul class="sub-item">
        <li><a class="sub-item-link" href="https://freecodecamp.org/" target="_blank">freeCodeCamp</a></li>
      </ul>
    </li>
  </ul>
</body>
</html>
